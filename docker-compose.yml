services:
  kurotsuki-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kurotsuki-sync-relay
    restart: unless-stopped
    ports:
      - "${PORT:-3050}:${PORT:-3050}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3050}
      - HOST=0.0.0.0
      - STORAGE_DIR=/data
      - AUTH_TOKEN=${AUTH_TOKEN:-kurotsuki_vault}
      - MAX_PAYLOAD_MB=${MAX_PAYLOAD_MB:-50}
      - CORS_ENABLED=${CORS_ENABLED:-true}
    volumes:
      - ./data:/data

  # Optional: Automatic SSL Reverse Proxy with Caddy
  # Uncomment below if you want automated Let's Encrypt HTTPS certificates
